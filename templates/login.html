<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion Propriétaire - {{ company.brand_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-['Poppins'] min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-2xl max-w-md w-full border border-slate-700 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white">{{ company.brand_name }} Admin</h1>
            <p class="text-xs text-slate-400">Entrez le mot de passe pour accéder à la gestion</p>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-300 mb-1">Mot de passe</label>
                <input type="password" id="loginPassword" required placeholder="Mot de passe (par défaut: 1234)" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white outline-none focus:border-blue-500">
            </div>
            <div id="errMsg" class="text-red-400 text-xs mb-4 hidden">Mot de passe incorrect !</div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-500 transition">Se Connecter</button>
        </form>
    </div>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('loginPassword').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pass})
            });
            if (res.ok) {
                window.location.reload();
            } else {
                document.getElementById('errMsg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
